---
name: Build ffmpeg dlls
# GitHub Action to build ffmpeg dlls on demand using vcpkg
# Wolfgang Stöggl <c72578@yahoo.de>, 2023-2026.

# yamllint disable rule:line-length
# yamllint disable-line rule:truthy
on:
  # push:
    # tags:
      # - 'v*.*.*'
  workflow_dispatch:

defaults:
  run:
    shell: cmd

jobs:
  MSVC:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images/blob/main/images/windows/Windows2022-Readme.md
        os: [windows-2022]
        triplet: [x64-windows, x86-windows]
        include:
          - os: windows-2022
            triplet: x64-windows
            # FFmpeg 8.1.2#3:
            # https://github.com/microsoft/vcpkg/commit/9e593bb18ea69cc5095e012465dcd675a822ed0d
            vcpkgCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
            vcpkgPackages: 'ffmpeg'
            configuration: 'x64'
            pluginDir: 'x64'
          - os: windows-2022
            triplet: x86-windows
            vcpkgCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'
            vcpkgPackages: 'ffmpeg'
            configuration: 'x86'
            pluginDir: 'win32'
    env:
      buildDir: '${{ github.workspace }}/build/'
      ffmpegVer: '8.1.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Set up pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '${{ matrix.vcpkgCommitId}}'
          runVcpkgInstall: false
      - name: Build pinned FFmpeg package
        shell: pwsh
        run: |
          $vcpkg = Join-Path '${{ github.workspace }}' 'vcpkg\vcpkg.exe'
          & $vcpkg install '${{ matrix.vcpkgPackages }}' --triplet '${{ matrix.triplet }}' --clean-after-build
          if ($LASTEXITCODE -ne 0) {
            throw "The pinned vcpkg FFmpeg build failed with exit code $LASTEXITCODE."
          }
      - name: Collect files
        shell: pwsh
        run: |
          $sourceRoot = Join-Path '${{ github.workspace }}' 'vcpkg\installed\${{ matrix.triplet }}\bin'
          $destinationRoot = Join-Path '${{ github.workspace }}' 'deploy\plugins\${{ matrix.pluginDir }}'
          New-Item -ItemType Directory -Force -Path $destinationRoot | Out-Null
          $nativeLibraries = @(
            Get-ChildItem -LiteralPath $sourceRoot -File |
              Where-Object { $_.Name -match '^(av|sw).*\.dll$' } |
              Sort-Object Name
          )
          if ($nativeLibraries.Count -eq 0) {
            throw "No FFmpeg runtime DLLs were produced for ${{ matrix.triplet }}."
          }
          $nativeLibraries | Copy-Item -Destination $destinationRoot
      - name: Build and run managed/native decoder probe
        shell: pwsh
        run: |
          dotnet restore eng\ci\FFmpegCodecWorker\FFmpegCodecWorker.csproj --force-evaluate -p:PlatformTarget=${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) {
            throw "The FFmpeg managed/native decoder probe restore failed with exit code $LASTEXITCODE."
          }
          dotnet build eng\ci\FFmpegCodecWorker\FFmpegCodecWorker.csproj -c Release --no-restore -p:PlatformTarget=${{ matrix.configuration }}
          if ($LASTEXITCODE -ne 0) {
            throw "The FFmpeg managed/native decoder probe build failed with exit code $LASTEXITCODE."
          }
          $probeSource = Join-Path '${{ github.workspace }}' 'eng\ci\FFmpegCodecWorker\bin\Release\net47'
          $probeRoot = Join-Path '${{ github.workspace }}' 'deploy\plugins\probe'
          Copy-Item -LiteralPath $probeSource -Destination $probeRoot -Recurse
          & (Join-Path $probeRoot 'CUETools.FFmpegCodecWorker.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "The FFmpeg managed/native decoder probe failed with exit code $LASTEXITCODE."
          }
      - name: Record license and immutable build evidence
        shell: pwsh
        run: |
          $noticeRoot = Join-Path '${{ github.workspace }}' 'deploy\THIRD-PARTY-NOTICES'
          New-Item -ItemType Directory -Force -Path $noticeRoot | Out-Null
          Copy-Item -LiteralPath 'vcpkg\installed\${{ matrix.triplet }}\share\ffmpeg\copyright' -Destination (Join-Path $noticeRoot 'FFmpeg.txt')
          Copy-Item -LiteralPath 'vcpkg\ports\ffmpeg\vcpkg.json' -Destination (Join-Path $noticeRoot 'FFmpeg-vcpkg.json')

          $dllRoot = Join-Path '${{ github.workspace }}' 'deploy\plugins\${{ matrix.pluginDir }}'
          $files = @(
            Get-ChildItem -LiteralPath $dllRoot -File -Filter '*.dll' |
              Sort-Object Name |
              ForEach-Object {
                $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($_.FullName)
                [ordered]@{
                  path = "plugins/${{ matrix.pluginDir }}/$($_.Name)"
                  length = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                  fileVersion = $version.FileVersion
                  productVersion = $version.ProductVersion
                }
              }
          )
          $manifest = [ordered]@{
            schema = 'cuetools.ffmpeg-build.v1'
            ffmpegVersion = '${{ env.ffmpegVer }}'
            ffmpegAutoGenVersion = '8.1.0'
            vcpkgCommit = '${{ matrix.vcpkgCommitId }}'
            triplet = '${{ matrix.triplet }}'
            configuration = '${{ matrix.configuration }}'
            files = $files
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText(
            (Join-Path '${{ github.workspace }}' 'deploy\ffmpeg-build.json'),
            $json + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false))

          $probeRoot = Join-Path '${{ github.workspace }}' 'deploy\plugins\probe'
          if (-not $probeRoot.StartsWith(
              (Join-Path '${{ github.workspace }}' 'deploy\plugins') +
                [IO.Path]::DirectorySeparatorChar,
              [StringComparison]::OrdinalIgnoreCase)) {
            throw "Refusing to clean unexpected probe path: $probeRoot"
          }
          Remove-Item -LiteralPath $probeRoot -Recurse -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg_${{ env.ffmpegVer }}_dlls_${{ matrix.pluginDir }}
          path: deploy/
