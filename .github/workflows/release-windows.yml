---
name: release-windows

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

defaults:
  run:
    shell: cmd

jobs:
  build:
    strategy:
      matrix:
        # https://github.com/actions/virtual-environments/blob/master/images/win/Windows2022-Readme.md
        os: [windows-2022]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    env:
      # yamllint disable-line rule:line-length
      DEVENV_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.com
      MSBUILD_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Test release-control contracts
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Test-VendorSourceStaging.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Test-NativeWarningBaseline.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Test-NativeDependencyPreparation.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Test-ClassicBuildReceipt.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Test-ClassicReleaseOrchestrator.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Test-ClassicArtifactCollection.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Test-ReleaseSafety.ps1
      - name: Prepare pinned staged dependency sources
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Build-NativeDependencies.ps1 -Configuration Release -ApplyPatchesOnly
      - name: Rebuild, receipt, collect, and publish the classic artifact
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Invoke-ClassicRelease.ps1 -DevenvPath "%DEVENV_PATH%" -MSBuildPath "%MSBUILD_PATH%"
      - name: Build modern closure with checked warning budget
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Invoke-BuildWithWarningGate.ps1 -Configuration Release
      # Gate releases on every hermetic suite with explicit discovery/skip counts.
      - name: Run all test discovery gates
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Invoke-TestSuites.ps1 -Lane all -Configuration Release -ResultsDirectory "%RUNNER_TEMP%\cuetools-release-tests"
      - name: Fuzz smoke - properties and parser/decoder corpora
        run: |
          dotnet run --project CUETools.Fuzz\CUETools.Fuzz.csproj -c Release --no-build -- 20260712 20000
      - name: Validate classic artifact contract and architecture-specific trust manifest
        run: |
          dotnet run --project eng\release\ArtifactValidator\ArtifactValidator.csproj --configuration Release -- bin\Release\CUETools_2.2.6 eng\release\classic-win.manifest.json
      - name: Clean-publish and validate CUETools 2026
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\Publish-Wpf.ps1 -Configuration Release
      - name: Generate deterministic artifact hashes and source receipts
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\New-Provenance.ps1 -ArtifactDirectory bin\Release\CUETools_2.2.6 -ContractPath eng\release\classic-win.manifest.json -OutputDirectory bin\Release\evidence\provenance -ArtifactName CUETools_2.2.6
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\New-Provenance.ps1 -ArtifactDirectory bin\Release\CUETools2026-win-x64 -ContractPath eng\release\wpf-win-x64.manifest.json -OutputDirectory bin\Release\evidence\provenance -ArtifactName CUETools2026-win-x64
      - name: Generate pinned CycloneDX and SPDX SBOMs
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\New-Sboms.ps1 -ArtifactDirectory bin\Release\CUETools2026-win-x64 -OutputDirectory bin\Release\evidence\sbom\wpf -CycloneInputPath CUETools.Wpf\CUETools.Wpf.csproj -CycloneFramework net8.0-windows -CycloneRuntime win-x64 -OutputStem cuetools-wpf -PackageName "CUETools 2026" -PackageVersion 2026.1.0
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\release\New-Sboms.ps1 -ArtifactDirectory bin\Release\CUETools_2.2.6 -OutputDirectory bin\Release\evidence\sbom\classic -CycloneInputPath CUETools.sln -CycloneFramework net47 -OutputStem cuetools-classic -PackageName CUETools -PackageVersion 2.2.6
      - name: Assert vendor submodules stayed clean
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Test-VendorSubmodulesClean.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy
          path: |
            bin/Release/CUETools_2.2.6/
            bin/Release/CUETools2026-win-x64/
            bin/Release/evidence/
