---
name: CI-wpf

# Builds the .NET 8 WPF app (CUETools 2026) and runs a bounded fuzz smoke. The legacy
# CI-windows.yml builds the full VS solution with devenv; this job needs only the .NET 8 SDK
# because its application closure targets .NET 8. Imported native codec DLLs are reproducible
# outputs from pinned, staged submodule/SDK source and are rebuilt explicitly below. Kept as its
# own workflow so a break in the modern app is obvious and independent of the legacy solution build.

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Stage patched vendor sources and rebuild native codec DLLs
        shell: powershell
        run: .\eng\ci\Build-NativeDependencies.ps1 -Configuration Release

      # Re-emits all compiler output and rejects only warning fingerprints above the checked
      # baseline. This prevents a warning-free summary from hiding warnings in transitive builds.
      - name: Build modern closure with checked warning budget
        shell: powershell
        run: .\eng\ci\Invoke-BuildWithWarningGate.ps1 -Configuration Release

      - name: Run modern test discovery gate
        shell: powershell
        run: .\eng\ci\Invoke-TestSuites.ps1 -Lane modern -Configuration Release -ResultsDirectory "$env:RUNNER_TEMP\cuetools-modern-tests"

      # Compiles the isolated mutation profiles against linked production sources and proves the
      # contract, threshold, and failure-policy checks. Mutants run in mutation.yml.
      - name: Validate mutation harness and profile baselines
        shell: powershell
        run: .\eng\mutation\Test-MutationHarness.ps1 -Build

      # Bounded, deterministic, headless property and checked-in corpus lanes.
      - name: Fuzz smoke - properties and parser/decoder corpora (20k iters)
        run: dotnet run --project CUETools.Fuzz/CUETools.Fuzz.csproj -c Release --no-build -- 20260712 20000

      - name: Assert vendor submodules stayed clean
        shell: powershell
        run: .\eng\ci\Test-VendorSubmodulesClean.ps1
