---
name: CI-windows

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: cmd

jobs:
  build:
    strategy:
      matrix:
        # https://github.com/actions/virtual-environments/blob/master/images/win/Windows2022-Readme.md
        os: [windows-2022]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    env:
      # yamllint disable-line rule:line-length
      DEVENV_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\devenv.com
      MSBUILD_PATH: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe
      SLN_PATH: CUETools.sln
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Stage patched vendor sources and rebuild native codec DLLs
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Build-NativeDependencies.ps1 -Configuration Release
      - name: MSBuild NuGet restore
        run: |
          "%MSBUILD_PATH%" "%SLN_PATH%" -t:restore -p:Configuration=Release
      - name: Build Release|Any CPU
        run: |
          "%DEVENV_PATH%" "%SLN_PATH%" /Build "Release|Any CPU"
      - name: Build Release|x64
        run: |
          "%DEVENV_PATH%" "%SLN_PATH%" /Build "Release|x64"
      - name: Build Release|Win32
        run: |
          "%DEVENV_PATH%" "%SLN_PATH%" /Build "Release|Win32"
      # Release|x64 above produced ThirdParty\x64\libFLAC_dynamic.dll, which the codec tests copy
      # into their output. The manifest gate also rejects zero-test discovery and excess skips.
      - name: Run legacy test discovery gate
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Invoke-TestSuites.ps1 -Lane legacy -Configuration Release -NoRestore -ResultsDirectory "%RUNNER_TEMP%\cuetools-legacy-tests"
      - name: Assert vendor submodules stayed clean
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File eng\ci\Test-VendorSubmodulesClean.ps1
